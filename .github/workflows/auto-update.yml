name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'updates.json'
      - 'manifest.json'
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clone upstream RoValra
        run: |
          set -euo pipefail
          rm -rf source-rovalra
          git clone --depth 1 https://github.com/NotValra/RoValra.git source-rovalra

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'source-rovalra/package-lock.json'

      - name: Install web-ext globally
        run: npm install -g web-ext

      - name: Check for upstream version changes
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM_VER=$(node -p "require('./source-rovalra/package.json').version")
          BASE_UPSTREAM=$(echo "$UPSTREAM_VER" | cut -d. -f1-3)

          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)
          LATEST_VER=${LATEST_TAG#v}
          BASE_LATEST=$(echo "$LATEST_VER" | cut -d. -f1-3)

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             && [ -n "$BASE_LATEST" ] \
             && [ "$BASE_UPSTREAM" = "$BASE_LATEST" ]; then
            echo "No new upstream version ($UPSTREAM_VER). Skipping."
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
          else
            echo "Building version: $UPSTREAM_VER"
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate custom version
        if: steps.check_version.outputs.SKIP != 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./source-rovalra/package.json');

          let parts = String(pkg.version)
            .replace(/[^0-9.]/g, '')
            .split('.')
            .filter(Boolean)
            .slice(0, 3);

          while (parts.length < 3) parts.push('0');

          const runNum = process.env.GITHUB_RUN_NUMBER || '1';
          const version = `${parts.join('.')}.${runNum}`;

          fs.appendFileSync(process.env.GITHUB_ENV, `VERSION=${version}\n`);
          console.log(`Generated version: ${version}`);
          NODE

      - name: Install dependencies and build extension
        if: steps.check_version.outputs.SKIP != 'true'
        run: |
          set -euo pipefail
          cd source-rovalra
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install
          fi
          if [ -f scripts/build-firefox.js ]; then
            node scripts/build-firefox.js
          else
            npm run build
          fi

      - name: Assemble extension and patch manifest
        if: steps.check_version.outputs.SKIP != 'true'
        run: |
          set -euo pipefail
          rm -rf ./extension ./release-assets ./web-ext-artifacts
          cp -r source-rovalra/dist-firefox ./extension

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const localesPath = './extension/_locales';
          if (fs.existsSync(localesPath)) {
            const enPath = path.join(localesPath, 'en');
            if (!fs.existsSync(enPath)) {
              const fallback = fs
                .readdirSync(localesPath)
                .find((name) => name.toLowerCase().startsWith('en'));
              if (fallback) {
                fs.cpSync(path.join(localesPath, fallback), enPath, {
                  recursive: true,
                });
                console.log(`Created fallback _locales/en from ${fallback}`);
              }
            }
          }

          const manifestPath = './extension/manifest.json';
          if (!fs.existsSync(manifestPath)) {
            console.error(`manifest.json not found at ${manifestPath}`);
            process.exit(1);
          }

          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const newVersion = process.env.VERSION;
          if (!newVersion) {
            console.error('VERSION environment variable is empty');
            process.exit(1);
          }

          manifest.version = newVersion;
          manifest.browser_specific_settings = manifest.browser_specific_settings || {};
          manifest.browser_specific_settings.gecko = {
            id: 'rovalra-custom-port@raviannaivar.com',
            update_url:
              'https://raw.githubusercontent.com/raviannaivar/RVFFP/main/updates.json',
            data_collection_permissions: {
              required: ['none'],
            },
          };

          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));
          console.log(`Updated extension/manifest.json to ${newVersion}`);

          fs.writeFileSync('./manifest.json', JSON.stringify(manifest, null, 2));
          console.log(`Synced root manifest.json to ${newVersion}`);
          NODE

          (cd extension && zip -r -q ../extension.zip . -x "*.DS_Store" "*.git*")

      - name: Update updates.json
        if: steps.check_version.outputs.SKIP != 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const updatesPath = './updates.json';
          const newVersion = process.env.VERSION;
          const addonId = 'rovalra-custom-port@raviannaivar.com';
          const downloadUrl =
            'https://github.com/raviannaivar/RVFFP/releases/latest/download/rovalra.xpi';

          let data = { addons: {} };
          if (fs.existsSync(updatesPath)) {
            try {
              data = JSON.parse(fs.readFileSync(updatesPath, 'utf8'));
            } catch (error) {
              console.error(`Could not parse updates.json: ${error.message}`);
            }
          }

          data.addons = data.addons || {};
          data.addons[addonId] = data.addons[addonId] || { updates: [] };
          data.addons[addonId].updates = [
            { version: newVersion, update_link: downloadUrl },
          ];

          fs.writeFileSync(updatesPath, JSON.stringify(data, null, 2));
          console.log(`Updated updates.json to ${newVersion}`);
          NODE

      - name: Commit and push version bumps
        if: steps.check_version.outputs.SKIP != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json manifest.json

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
          else
            git commit -m "chore: sync metadata for v${VERSION}"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Sign extension with Mozilla (unlisted)
        if: steps.check_version.outputs.SKIP != 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          web-ext sign \
            --source-dir ./extension \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --channel unlisted \
            --timeout 900000

          mkdir -p ./release-assets
          XPI_FILE=$(find web-ext-artifacts -maxdepth 1 -name '*.xpi' -print -quit)
          if [ -z "$XPI_FILE" ]; then
            echo "Signed .xpi was not produced by web-ext."
            exit 1
          fi

          cp "$XPI_FILE" ./release-assets/rovalra.xpi
          cp extension.zip ./release-assets/extension.zip

      - name: Create GitHub Release
        if: steps.check_version.outputs.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets."
            gh release upload "$TAG" ./release-assets/* --clobber
          else
            gh release create "$TAG" ./release-assets/* \
              --title "Release ${TAG}" \
              --notes "RoValra Firefox port ${VERSION}"
          fi
