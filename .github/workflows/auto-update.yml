name: Build and Release Extension

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'source-rovalra/package-lock.json'

      - name: Clone original RoValra repo
        run: |
          rm -rf source-rovalra
          git clone https://github.com/NotValra/RoValra.git source-rovalra

      - name: Check for new version
        id: check_version
        run: |
          node -e '
            const fs = require("fs");
            const pkg = require("./source-rovalra/package.json");
            let upstreamVer = pkg.version;
            
            let parts = upstreamVer.split(".").filter(Boolean);
            if (parts.length > 3) {
              parts = parts.slice(0, 3);
            }
            
            let runNum = process.env.GITHUB_RUN_NUMBER || "1";
            let uniqueVer = `${parts.join(".")}.${runNum}`;
            
            fs.appendFileSync(process.env.GITHUB_ENV, `VERSION=${uniqueVer}\n`);
            console.log(`Generated version: ${uniqueVer}`);
          '

      - name: Install dependencies & Build Firefox Extension
        run: |
          cd source-rovalra
          npm ci --legacy-peer-deps || npm install
          node scripts/build-firefox.js || npm run build

      - name: Prepare build files
        run: |
          rm -rf ./extension
          cp -r source-rovalra/dist-firefox ./extension
          cd extension && zip -r ../extension.zip ./*

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.VERSION }}" extension.zip \
            --title "Release v${{ env.VERSION }}" \
            --notes "Automated build of RoValra extension version ${{ env.VERSION }}" \
            --clobber
