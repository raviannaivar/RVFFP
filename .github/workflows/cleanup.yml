name: Cleanup Old Artifacts and Runs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Clear GitHub Actions build cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh extension install actions/gh-actions-cache || true
          gh actions-cache delete --all -R "$REPO" --confirm || true

      - name: Delete untagged container images (GHCR)
        uses: Chocobo1/cleanup-ghcr-actions@v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          untagged-only: true

      - name: Delete merged branches via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/$REPO" --jq '.default_branch')
          
          gh api "repos/$REPO/branches" --paginate --jq '.[].name' | while read -r BRANCH; do
            if [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then
              IS_MERGED=$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$BRANCH" --jq '.ahead_by')
              if [ "$IS_MERGED" -eq 0 ]; then
                echo "Deleting merged branch: $BRANCH"
                gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true
              fi
            fi
          done

      - name: Prune unreachable git objects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X POST "repos/$REPO/git/gcb" || true

      - name: Delete tags without associated releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          RELEASE_TAGS=$(gh api "repos/$REPO/releases?per_page=100" --paginate --jq '.[].tag_name')
          ALL_TAGS=$(gh api "repos/$REPO/tags?per_page=100" --paginate --jq '.[].name')
          
          for TAG in $ALL_TAGS; do
            if ! echo "$RELEASE_TAGS" | grep -qx "$TAG"; then
              gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" || true
            fi
          done

      - name: Close stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: 'Эта задача не обновлялась 30 дней и будет закрыта через 7 дней.'
          stale-pr-message: 'Этот PR не обновлялся 30 дней и будет закрыт через 7 дней.'

      - name: Delete old artifacts
        uses: cfauster/action-delete-old-artifacts@v1
        with:
          older-than: '14 days'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 5
