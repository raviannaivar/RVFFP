name: Cleanup Old Artifacts and Runs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Clear GitHub Actions build cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          KEYS=$(gh api "repos/$REPO/actions/caches?per_page=100" --paginate --jq '.actions_caches[].key' 2>/devnull || true)
          for KEY in $KEYS; do
            echo "Deleting cache key: $KEY"
            gh api -X DELETE "repos/$REPO/actions/caches?key=$KEY" || true
          done

      - name: Delete merged branches via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/$REPO" --jq '.default_branch')

          gh api "repos/$REPO/branches" --paginate --jq '.[].name' | while read -r BRANCH; do
            if [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then
              IS_MERGED=$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$BRANCH" --jq '.ahead_by' 2>/devnull || echo "1")
              if [ "$IS_MERGED" -eq 0 ]; then
                echo "Deleting merged branch: $BRANCH"
                gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true
              fi
            fi
          done

      - name: Delete tags without associated releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/releases?per_page=100" --paginate --jq '.[].tag_name' | sort -u > /tmp/release_tags
          gh api "repos/$REPO/tags?per_page=100"     --paginate --jq '.[].name'     | sort -u > /tmp/all_tags

          comm -23 /tmp/all_tags /tmp/release_tags | while read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Deleting tag without release: $TAG"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" || true
          done

      - name: Close stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 7

      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ARTIFACT_IDS=$(gh api "repos/$REPO/actions/artifacts?per_page=100" --paginate --jq '.artifacts[].id' 2>/devnull || true)
          for ID in $ARTIFACT_IDS; do
            echo "Deleting artifact ID: $ID"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$ID" || true
          done

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 5
