name: Build and Release Extension

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone original RoValra repo
        run: |
          rm -rf source-rovalra
          git clone https://github.com/NotValra/RoValra.git source-rovalra

      - name: Check for new upstream version
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_VER=$(node -p "require('./source-rovalra/package.json').version")
          LATEST_RELEASE=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || echo "none")

          if [ "$LATEST_RELEASE" != "none" ]; then
            BASE_RELEASE_VER=$(echo "$LATEST_RELEASE" | sed 's/^v//' | cut -d. -f1-3)
          else
            BASE_RELEASE_VER="none"
          fi

          if [ "$UPSTREAM_VER" == "$BASE_RELEASE_VER" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "SKIP=true" >> $GITHUB_OUTPUT
          else
            echo "SKIP=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate custom version
        if: steps.check_version.outputs.SKIP != 'true'
        id: generate_version
        run: |
          node -e '
            const fs = require("fs");
            const pkg = require("./source-rovalra/package.json");
            let upstreamVer = pkg.version;
            
            let parts = upstreamVer.split(".").filter(Boolean);
            if (parts.length > 3) {
              parts = parts.slice(0, 3);
            }
            
            let runNum = process.env.GITHUB_RUN_NUMBER || "1";
            let attemptNum = process.env.GITHUB_RUN_ATTEMPT || "1";
            
            let uniqueVer = `${parts.join(".")}.${runNum}${attemptNum}`;
            
            fs.appendFileSync(process.env.GITHUB_ENV, `VERSION=${uniqueVer}\n`);
            console.log(`Generated version: ${uniqueVer}`);
          '

      - name: Install dependencies & Build Firefox Extension
        if: steps.check_version.outputs.SKIP != 'true'
        run: |
          cd source-rovalra
          npm ci --legacy-peer-deps || npm install
          node scripts/build-firefox.js || npm run build

      - name: Prepare build files and patch manifest
        if: steps.check_version.outputs.SKIP != 'true'
        run: |
          rm -rf ./extension
          cp -r source-rovalra/dist-firefox ./extension
          
          node -e '
            const fs = require("fs");
            const manifestPath = "./extension/manifest.json";
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            
            manifest.version = process.env.VERSION;
            manifest.browser_specific_settings = {
              gecko: {
                id: "rovalra-custom-port@raviannaivar.com"
              }
            };
            
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));
          '
          
          cd extension && zip -r ../extension.zip ./*

      - name: Sign Extension with Mozilla (Unlisted)
        if: steps.check_version.outputs.SKIP != 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx web-ext sign \
            --source-dir ./extension \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --channel unlisted

          mkdir -p ./release-assets
          cp web-ext-artifacts/*.xpi ./release-assets/rovalra.xpi
          cp extension.zip ./release-assets/extension.zip

      - name: Create GitHub Release
        if: steps.check_version.outputs.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.VERSION }}" ./release-assets/* \
            --title "Release v${{ env.VERSION }}" \
            --notes "extension version ${{ env.VERSION }}"
